version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sakina_postgres
    restart: always
    environment:
      POSTGRES_DB: sakina_db
      POSTGRES_USER: sakina_user
      POSTGRES_PASSWORD: sakina_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sakina_user -d sakina_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: yoness/sakina-backend:latest
    container_name: sakina_django
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=sakina_db
      - DB_USER=sakina_user
      - DB_PASSWORD=sakina_password
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
