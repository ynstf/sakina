version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sakina_postgres
    restart: always
    environment:
      POSTGRES_DB: sakina_db
      POSTGRES_USER: sakina_user
      POSTGRES_PASSWORD: sakina_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sakina_user -d sakina_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: sakina_django
    restart: always
    #command: sh -c "make migrate && make run"
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=sakina_db
      - POSTGRES_USER=sakina_user
      - POSTGRES_PASSWORD=sakina_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
